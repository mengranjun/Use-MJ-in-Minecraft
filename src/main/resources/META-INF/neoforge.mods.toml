modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
authors = "${mod_authors}"

# This mod only exists on the client: it plays a video on the player's own screen.
displayTest = "IGNORE_SERVER_VERSION"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
