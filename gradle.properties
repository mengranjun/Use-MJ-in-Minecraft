# Video Trigger — NeoForge mod build properties
# ============================================================
# Target: Minecraft 1.26.2 with NeoForge 26.2.0.72 (the "26.2" line)
# ============================================================

# Minecraft
minecraft_version=1.26.2
minecraft_version_range=[1.26.2,)

# NeoForge
neo_version=26.2.0.72
neo_version_range=[26.2.0.72,)

# Loader (FML/NeoForge mod loader) — broad, matches 2.x
loader_version_range=[2,)

# Mod metadata
mod_id=videotrigger
mod_name=Chat Video Trigger
mod_license=LGPL-2.1-or-later
mod_version=1.0.0
mod_group=com.example
mod_authors=DSH
mod_description=Plays a custom video (GIF or frame sequence) on the player screen when a custom chat trigger text is typed.

# Java — Minecraft 1.26.2 / NeoForge 26.x requires Java 25
java_version=25

# NOTE: build with JAVA_HOME pointed at a JDK 25 (Minecraft 1.26.2 / NeoForge 26.2
# require Java 25). Gradle auto-detects the running JVM as the toolchain.

